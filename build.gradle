plugins {
    id 'com.gradleup.shadow' version '9.4.2'
    id 'java'
}

group = 'com.froobworld'
version = '1.4.0-leaf26.2'
jar.enabled = false;

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

repositories {
    mavenLocal();
    mavenCentral()
    maven {
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots"
    }
    maven {
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
    maven {
        url = 'https://repo.codemc.org/repository/maven-public/'
    }
    maven {
        url = 'https://jitpack.io'
    }
    maven {
        url = 'https://repo.extendedclip.com/releases/'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    compileOnly 'io.papermc.paper:paper-api:26.2.build.124-stable'
    testImplementation 'io.papermc.paper:paper-api:26.2.build.124-stable'
    compileOnly 'me.clip:placeholderapi:2.12.3'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    implementation 'org.jooq:joor-java-8:0.9.14'
    implementation 'com.github.froobynooby:nab-configuration:7c00c954618d93fa7d8c07f4bf653a656b25aad4'
    implementation 'org.bstats:bstats-base:3.0.2'
}

def pluginVersion = version.toString()
processResources {
    inputs.property('version', pluginVersion)
    filesMatching('plugin.yml') {
        expand(version: pluginVersion)
    }
}

shadowJar {
    archiveFileName = 'FarmControl-' + project.version.toString() + '.jar';

    relocate 'com.froobworld.nabconfiguration', 'com.froobworld.farmcontrol.lib.nabconfiguration'
    relocate 'org.joor', 'com.froobworld.farmcontrol.lib.joor'
    relocate 'org.bstats','com.froobworld.farmcontrol.lib.bstats'
}

artifacts {
    shadowJar;
}

assemble.dependsOn(shadowJar);
